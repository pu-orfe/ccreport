<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} — ccreport</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="bar"><span class="brand">ccreport</span></header>
<main>
  <h1>{{ title }}</h1>
  <p class="detail">{{ detail }}</p>
  <p class="muted">
    Access to ccreport is limited to institutional accounts on an access list.
    If you believe you should have access, ask a ccreport administrator to add
    your university account; nobody is added automatically.
  </p>
</main>
<footer>ccreport {{ version }}</footer>
</body>
</html>
