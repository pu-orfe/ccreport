name: Teardown

on:
  workflow_dispatch:
    inputs:
      webapp_name:
        description: 'Type the Azure Web App name exactly to confirm teardown'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  teardown:
    runs-on: ubuntu-latest
    environment: production-teardown
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Confirm web app name
        run: |
          test "${{ inputs.webapp_name }}" = "${{ vars.AZURE_WEBAPP_NAME }}"
      - name: Teardown
        run: deploy/ccreport-azure teardown --yes --no-reprompt
