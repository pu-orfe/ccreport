name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Skip cleanly until Azure is configured. A repository with no AZURE_*
    # variables has nothing to deploy to, and a deploy job that fails on every
    # push teaches people to ignore red marks.
    if: vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_RESOURCE_GROUP != '' && vars.ACR_NAME != ''
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh
      - name: Remember previous image
        id: previous
        shell: bash
        run: |
          previous=$(az webapp config container show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query properties.linuxFxVersion -o tsv 2>/dev/null || true)
          echo "image=$previous" >> "$GITHUB_OUTPUT"
      - name: Build image in ACR
        run: |
          az acr build --registry "$ACR_NAME" --image "ccreport:latest" --image "ccreport:${GITHUB_SHA}" --build-arg INSTALL_PLAYWRIGHT=true --file Dockerfile .
      - name: Deploy and configure
        run: deploy/ccreport-azure deploy --yes --no-reprompt --verbose
      - name: Migrate
        run: deploy/ccreport-azure resume --yes --no-reprompt --verbose
      - name: Verify
        id: verify
        run: deploy/ccreport-azure status --verbose
      - name: Roll back image on failure
        if: failure() && steps.previous.outputs.image != ''
        run: |
          az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --linux-fx-version "${{ steps.previous.outputs.image }}"
          az webapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME"
