# Alembic configuration for local use: `alembic upgrade head` from a checkout.
#
# The deployed container has no repository checkout, so it runs
# `ccreport db upgrade`, which builds this configuration in memory and points
# script_location at the packaged migrations. Both paths run the same scripts.
[alembic]
script_location = src/ccreport/migrations
prepend_sys_path = src
# Left empty on purpose: env.py falls back to CCREPORT_DATABASE_URL, so the
# connection string is never duplicated into a file that could drift.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
