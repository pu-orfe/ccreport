name = "ccreport"
image = "ccreport"
health_path = "/healthz"
repo = "pu-orfe/ccreport"
location_default = "eastus"
resource_group_suffix = "rg"
app_service_plan_sku = "B1"
postgres_sku = "Standard_B1ms"
postgres_storage_gb = 32
blob_container = "ccreport-artifacts"
keyvault_key_name = "ccreport-token-dek"
required_python = "3.12"

[[setting]]
name = "CCREPORT_ENVIRONMENT"
type = "fixed"
required = true
value = "production"

[[setting]]
name = "CCREPORT_LOG_LEVEL"
type = "fixed"
required = true
value = "INFO"

[[setting]]
name = "CCREPORT_BASE_URL"
type = "computed"
required = true

[[setting]]
name = "CCREPORT_MONTH_WINDOW"
type = "fixed"
required = true
value = "8"

[[setting]]
name = "CCREPORT_REQUIRED_EMAIL_DOMAIN"
type = "fixed"
required = true
value = "princeton.edu"

[[setting]]
name = "CCREPORT_ALLOWED_PRINCIPALS"
type = "list"
required = true
prompt = "Allowed Princeton principals; empty means DENY ALL"

[[setting]]
name = "CCREPORT_ADMIN_PRINCIPALS"
type = "list"
required = true
prompt = "Administrator principals; each must also be allowed"

[[setting]]
name = "CCREPORT_DATABASE_URL"
type = "secret"
required = true
keyvault_secret = "ccreport-database-url"

[[setting]]
name = "CCREPORT_BLOB_ACCOUNT_URL"
type = "computed"
required = true

[[setting]]
name = "CCREPORT_BLOB_CONTAINER"
type = "computed"
required = true

[[setting]]
name = "CCREPORT_KEYVAULT_URL"
type = "computed"
required = true

[[setting]]
name = "CCREPORT_KEYVAULT_KEY_NAME"
type = "computed"
required = true

[[setting]]
name = "CCREPORT_SESSION_SECRET"
type = "secret"
required = true
keyvault_secret = "ccreport-session-secret"
generate = "hex32"

[[setting]]
name = "CCREPORT_HEADER_CACHE_TTL_SECONDS"
type = "fixed"
required = true
value = "600"

[[setting]]
name = "CCREPORT_HEADER_CACHE_MAX_ENTRIES"
type = "fixed"
required = true
value = "256"

[[setting]]
name = "CCREPORT_MS_CLIENT_ID"
type = "secret"
required = false
keyvault_secret = "ccreport-ms-client-id"

[[setting]]
name = "CCREPORT_MS_CLIENT_SECRET"
type = "secret"
required = false
keyvault_secret = "ccreport-ms-client-secret"

[[setting]]
name = "CCREPORT_MS_AUTHORITY"
type = "fixed"
required = true
value = "https://login.microsoftonline.com/common"

[[setting]]
name = "CCREPORT_MS_SCOPES"
type = "fixed"
required = true
value = "offline_access User.Read Mail.Read"

[[setting]]
name = "CCREPORT_GOOGLE_CLIENT_ID"
type = "secret"
required = false
keyvault_secret = "ccreport-google-client-id"

[[setting]]
name = "CCREPORT_GOOGLE_CLIENT_SECRET"
type = "secret"
required = false
keyvault_secret = "ccreport-google-client-secret"

[[setting]]
name = "CCREPORT_GOOGLE_SCOPES"
type = "fixed"
required = true
value = "https://www.googleapis.com/auth/gmail.readonly"

[[setting]]
name = "CCREPORT_GOOGLE_HOSTED_DOMAIN"
type = "fixed"
required = false
value = "princeton.edu"

[[setting]]
name = "CCREPORT_GOOGLE_OAUTH_PUBLISHING_STATUS"
type = "fixed"
required = true
value = "unknown"

[[setting]]
name = "CCREPORT_ENABLE_PERSONAL_GMAIL_OAUTH"
type = "bool"
required = true
value = "false"

[[setting]]
name = "CCREPORT_ENABLE_IMAP"
type = "bool"
required = true
value = "true"

[[setting]]
name = "CCREPORT_IMAP_DEFAULT_HOST"
type = "fixed"
required = true
value = "imap.gmail.com"

[[setting]]
name = "CCREPORT_IMAP_DEFAULT_PORT"
type = "fixed"
required = true
value = "993"

[[setting]]
name = "CCREPORT_ENABLE_PLAYWRIGHT_FALLBACK"
type = "bool"
required = true
value = "true"

[[setting]]
name = "CCREPORT_ALLOW_REMOTE_IMAGES"
type = "bool"
required = true
value = "false"

[[setting]]
name = "CCREPORT_MAX_ATTACHMENT_MB"
type = "fixed"
required = true
value = "25"
